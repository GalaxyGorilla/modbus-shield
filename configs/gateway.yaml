# modbus-shield example configuration — gateway (v1) shape.
# One file = one proxy instance; each `devices:` entry couples exactly one
# front-leg listener with one upstream legacy device.
#
#   [N clients] --Modbus TCP--> [modbus-shield] --Modbus TCP--> [legacy device]
#
# Run:  modbus-shield gateway --config /etc/modbus-shield/gateway.yaml
# Reload (no restart, no dropped clients): kill -HUP <pid>
#   Applies: allow, read_only/write_policy, max_clients, rate limits,
#   read_cache_ttl_ms, request_delay_ms, lenient_correlation,
#   idle_timeout_ms, timeout_ms, device_unit_id, health_unit_id, mbaps roles.
#   Needs a restart: listen_addr, extra_listen, device_addr, tls, device_tls,
#   transparent, rtu_over_tcp, adding/removing devices (logged as warnings).
# Or without a file (single device, flags only):
#   modbus-shield gateway --listen :5020 --device 10.0.0.42:502

devices:
  # Retrofit box in front of a fragile legacy PLC: everyone may read,
  # nobody may write, only the SCADA subnet may connect at all.
  - name: legacy-plc
    listen_addr: ":5020"        # clients connect here (repoint them once)
    device_addr: "10.0.0.42:502" # the legacy device (plain Modbus TCP)
    read_only: true              # write FCs get a Modbus exception (0x01)
    allow:                       # client allow-list (IPs or CIDRs)
      - "10.8.0.0/24"            # SCADA segment
      - "192.168.1.7"            # one engineering station
    max_clients: 8               # shield the device from conn storms
    rate_per_sec: 50             # shield it from polling storms (shared by
                                 # all clients — total device traffic)
    # rate_per_client_per_sec: 5 # optional: cap EACH client connection too,
                                 # so one runaway poller cannot spend the
                                 # shared budget the others need (its
                                 # rejections do not charge rate_per_sec)
    timeout_ms: 5000             # per-request upstream deadline
    # lenient_correlation: true  # optional: accept a device leg that does
                                 # not echo transaction IDs or sets a
                                 # non-zero MBAP protocol ID (some
                                 # converters do; strict mode rejects them
                                 # with exception 0x0B). Framing stays
                                 # strict; clients still see their own txn ID
    # extra_listen:              # optional (B10): additional front-leg
    #   - ":5021"                # bind addresses for the SAME device —
    #   - "127.0.0.2:5020"       # every door shares ONE upstream
                                # connection, the conn cap, allow-list,
                                # rate limit and TLS config
    # request_delay_ms: 10       # optional pacing (B5): minimum gap between
                                  # requests toward picky legacy devices
    # idle_timeout_ms: 60000     # optional (B6): close front connections
                                  # idle longer than this (frees cap slots
                                  # from dead pollers)
    # device_unit_id: 17         # optional remap (serial-gateway style):
                                 # clients keep their unit IDs, the device
                                 # always sees 17; responses are rewritten
                                 # back to the client's original unit ID.
    # tls:                       # front-leg TLS termination (device side
    #   cert: server.crt         # stays plain; see examples/tls.md)
    #   key: server.key
    #   client_ca: ca.crt        # uncomment for mTLS (required client certs)
    # health_unit_id: 200        # optional: the proxy answers requests to
                                  # this virtual unit-ID itself with readable
                                  # health registers (uptime, upstream state,
                                  # counters; see examples/health.md)
    # device_tls:                # secure the UPSTREAM leg instead (two-proxy
    #   ca_cert: ca.crt          # secured line; the far side is a second
    #   server_name: farbox      # gateway with a tls: block; see
    #   cert: front.crt          # examples/two-proxy.md)
    #   key: front.key
    # mbaps:                     # mbaps role authorization (requires tls +
    #   roles:                   # client_ca above; see examples/mbaps.md):
    #     operator: [1, 2, 3, 4]               # reads only
    #     engineer: [1, 2, 3, 4, 5, 6, 15, 16] # reads + writes
    # rtu_over_tcp: true         # device leg speaks bare Modbus RTU frames
                                  # (serial-to-TCP converter without MBAP;
                                  # the front leg stays Modbus TCP)
    # read_cache_ttl_ms: 5000    # optional (B8): serve repeated FC 1-4
                                  # reads from memory for this long; the
                                  # device is only contacted on a miss.
                                  # A hit costs no rate token (the limiters
                                  # exist to protect the device)
    # write_policy:              # address-scoped writes instead of
    #   default: deny            # read_only (they are exclusive): allow
    #   rules:                   # ONLY FC6/FC16 to registers 0-99, block a
    #     - fc: [6, 16]          # protected block, allow everything else
    #       from: 0              # for a deny-list ... see examples/gateway.md
    #       to: 99
    #       action: allow
    #     - unit: 2              # rules can be scoped per client unit ID
    #       fc: [6]
    #       from: 200
    #       to: 255
    #       action: deny
    #     - fc: [21]             # omit from/to for FCs without an address
    #       action: allow

  # Second device behind the same box, unrestricted reads/writes.
  - listen_addr: ":5021"
    device_addr: "10.0.0.43:502"

log:
  level: info        # debug | info | warn | error
  format: console    # console | json

# metrics_listen: ":9202"  # uncomment to serve Prometheus metrics
# transparent: true         # transparent bump-in-the-wire mode (B3, Linux-only):
                            # forward to the client's ORIGINAL destination from
                            # conntrack (netfilter REDIRECT + SO_ORIGINAL_DST)
                            # instead of dialing device_addr — zero client/device
                            # reconfiguration. Requires scripts/setup-transparent.sh
                            # + CAP_NET_ADMIN. FAIL-OPEN: a missing redirect rule
                            # flows traffic unproxied to the device.
                            # See examples/transparent.md.
